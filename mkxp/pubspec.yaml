name: mkxp
description: 原生桥接插件，承载 MKXP-Z 引擎与 UiKitView（RPG Maker XP / Essentials 21.1）。
version: 0.0.1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MkxpPlugin
      # 仅支持 iOS（目标平台）。其余平台不声明。

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
