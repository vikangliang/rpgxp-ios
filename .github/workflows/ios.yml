name: iOS Build

on:
  # 不直接在 push 上触发：等 build-mkxp.yml 完成后用【同一次提交】的
  # MKXP.framework 编 App。此前两 workflow 并行触发，iOS 只能拿到上一个
  # 提交的旧框架——引擎修复要晚一轮才生效（Context.o 问题就这么被掩埋过）。
  workflow_run:
    workflows: ["Build MKXP framework (M1a)"]
    types: [completed]
  workflow_dispatch:

jobs:
  build:
    # 钉在 macos-15：默认 Xcode 16.4，且自带 CocoaPods（macos-26 默认 Xcode 26，旧版 Flutter 不兼容）
    runs-on: macos-15
    permissions:
      contents: write   # 供失败摘要推回 ci-status 分支
    steps:
      - uses: actions/checkout@v4
        with:
          # 检出触发本次构建的那次提交（workflow_run 携带；手动触发时用默认 ref）
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 用最新 stable，与 runner 的 Xcode 保持兼容（勿再钉死旧版本号）
          channel: 'stable'
          cache: true

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          flutter --version
          pod --version

      # flutter create 会重新生成根目录 pubspec.yaml/lib/ios ，先备份我们的源码
      - name: Backup app sources
        run: |
          cp pubspec.yaml /tmp/app_pubspec.yaml
          cp -r lib /tmp/app_lib

      # 本地无 Mac，用 CI 生成 iOS 工程（含 Runner.xcodeproj）
      # 工作区目录名以数字开头，不能做 Dart 包名，必须显式指定 --project-name
      - name: Generate iOS project (flutter create)
        run: flutter create --platforms=ios --org com.yourapp --project-name rpgxp_loader .

      # 还原我们的源码，并通过 flutter pub get 集成 mkxp 原生插件
      - name: Restore sources & integrate plugin
        run: |
          cp -f /tmp/app_pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/app_lib lib
          flutter pub get

      # 开文件共享：M2 的导入功能做好前，靠 iTunes 文件共享 / iMazing /「文件」App
      # 把游戏文件夹（顶层含 Game.ini + Data/）拖进沙盒 Documents/。
      - name: Enable file sharing
        run: |
          set -eo pipefail
          for kv in "UIFileSharingEnabled bool true" "UISupportsDocumentBrowser bool true"; do
            key=${kv%% *}; rest=${kv#* }
            /usr/libexec/PlistBuddy -c "Add :$key $rest" ios/Runner/Info.plist 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$key $rest" ios/Runner/Info.plist
          done
          /usr/libexec/PlistBuddy -c "Print" ios/Runner/Info.plist \
            | grep -E "FileSharing|DocumentBrowser" | tee -a /tmp/ios-build.log

      # 取本次提交的 build-mkxp 产物 MKXP.framework，放到插件目录供 pod 链接。
      # workflow_run 触发时用触发运行的 id（同一次提交的框架）；
      # 手动触发（workflow_dispatch）时退而求其次取最近一次成功。
      # 输出 tee 到 /tmp/ios-build.log，失败摘要步骤读它。
      - name: Download MKXP.framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          {
            RUN_ID="${{ github.event.workflow_run.id }}"
            if [ -z "$RUN_ID" ]; then
              RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mkxp.yml \
                         --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            fi
            echo "RUN_ID=${RUN_ID:-<empty>}"
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::找不到可用的 build-mkxp 运行，无 MKXP.framework"; exit 1
            fi
            rm -rf mkxp/ios/MKXP.framework
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name MKXP-framework --dir mkxp/ios/MKXP.framework
            # 兼容两种 zip 布局：内容在根 / 多嵌一层 MKXP.framework
            if [ -d mkxp/ios/MKXP.framework/MKXP.framework ]; then
              mv mkxp/ios/MKXP.framework/MKXP.framework/* mkxp/ios/MKXP.framework/
              rmdir mkxp/ios/MKXP.framework/MKXP.framework
            fi
            ls -R mkxp/ios/MKXP.framework
            test -f mkxp/ios/MKXP.framework/MKXP \
              || { echo "::error::MKXP.framework layout unexpected"; exit 1; }
          } 2>&1 | tee /tmp/ios-build.log

      # 静态 framework 的 pod target 不解析外部依赖，App 链接看不到 MKXP.framework
      # （Undefined symbol: _mkxp_run）。这里显式把它注入 Runner 的链接阶段，
      # 并补一个链接锚点让 Runner 自身引用引擎符号（顺序无关），
      # 同时补齐引擎需要的系统框架/库。详见 scripts/ios-link-mkxp.rb 注释。
      - name: Link MKXP.framework into Runner
        run: |
          set -eo pipefail
          cp -f scripts/mkxp-link-anchor.m ios/Runner/MkxpLinkAnchor.m
          # macos runner 的 CocoaPods 自带 xcodeproj gem；万一缺失就装（runner 上 sudo 免密）
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj
          ruby scripts/ios-link-mkxp.rb ios/Runner.xcodeproj mkxp/ios/MKXP.framework ios/Runner/MkxpLinkAnchor.m 2>&1 | tee -a /tmp/ios-build.log

      # 不签名编译（Sideloadly 在 Windows 侧重签安装）。首次真正链接 MKXP.framework。
      - name: Build iOS (no codesign)
        run: |
          set -eo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee -a /tmp/ios-build.log

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          {
            mkdir -p build/Payload
            cp -r build/ios/iphoneos/Runner.app build/Payload/
            cd build && zip -r app.ipa Payload
          } 2>&1 | tee -a /tmp/ios-build.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: rpgxp-loader-ipa
          path: build/app.ipa

      # 失败时把日志推回 ci-status-ios 分支（与 build-mkxp 的 ci-status 分开，
      # 两边都 --force 推同一分支会互相覆盖）。[skip ci] 防重触发。
      - name: Publish failure summary
        if: failure()
        run: |
          mkdir -p ci-status
          {
            echo "# iOS build failure"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: ${GITHUB_SHA::7} $(git log -1 --format=%s)"
            echo "date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo '## duplicate/undefined symbols (aggregated)'
            echo '```'
            grep -oE "(duplicate symbol|Undefined symbol): .*" /tmp/ios-build.log 2>/dev/null \
              | sed -E "s/.*'(_.*)'.*/\1/" | sort | uniq -c | sort -rn | head -60
            echo '```'
            echo '## ios-build.log (tail 120)'
            echo '```'
            tail -120 /tmp/ios-build.log 2>/dev/null || echo '(no log)'
            echo '```'
          } > ci-status/last-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/last-failure.md
          git commit -m "ci: ios build failure summary [skip ci]"
          git push origin HEAD:ci-status-ios --force
