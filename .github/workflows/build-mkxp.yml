name: Build MKXP framework (M1a)

# 隔离构建 MKXP.framework，不触碰 App 的 IPA 流水线。
# 只在 push 到 main 时跑（或手动 workflow_dispatch），产物作为 artifact 上传。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mkxp:
    runs-on: macos-15
    permissions:
      contents: write   # 供失败摘要推回 ci-status 分支
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg installed (arm64-ios-static)
        uses: actions/cache@v4
        with:
          path: deps/vcpkg/installed
          key: vcpkg-ios-static-${{ hashFiles('scripts/build_mkxp_ios.sh', 'scripts/vcpkg-triplets/arm64-ios-static.cmake') }}
          restore-keys: vcpkg-ios-static-

      - name: Cache cross-built Ruby
        uses: actions/cache@v4
        with:
          # 与脚本 PREFIX（deps/ruby-ios-$RUBY_VER）一致；此前误写 deps/ruby-ios，
          # 路径不存在导致缓存从未生效（Ruby 每轮全量重建）。
          path: deps/ruby-ios-3.3.12
          key: ruby-ios-3.3.12-${{ hashFiles('scripts/build_mkxp_ios.sh') }}
          # 不用 restore-keys：脚本变更（如 ASFLAGS 修复）必须逼 Ruby 重建，
          # 否则旧产物里按宿主编成的 macOS 架构对象会污染最终链接。

      - name: Show toolchain
        run: |
          xcodebuild -version
          brew --version

      - name: Build MKXP.framework
        run: bash scripts/build_mkxp_ios.sh

      - name: Upload MKXP.framework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MKXP-framework
          path: mkxp/ios/MKXP.framework
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-build-log
          path: build-mkxp.log
          if-no-files-found: warn

      # 把符号冲突诊断报告推到 ci-status 分支（App 侧 force_load 会不会炸 duplicate
      # symbols，取决于这里列出的跨归档重复定义）。成功也推，免 token 可读。
      - name: Publish symbol collisions
        if: always()
        run: |
          mkdir -p ci-status
          {
            echo "# MKXP symbol collisions (merged archive)"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: ${GITHUB_SHA::7} $(git log -1 --format=%s)"
            echo "date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo '## ruby/zlib build facts'
            echo '```'
            grep -E "zlib (static )?ext|Init_zlib|ruby static lib|with-zlib" build-mkxp.log 2>/dev/null || echo '(no zlib lines)'
            echo '```'
            echo '```'
            grep -E "^COLLISION" build-mkxp.log 2>/dev/null || echo '(no collisions)'
            echo '```'
          } > ci-status/last-collisions.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/last-collisions.md
          git commit -m "ci: mkxp symbol collisions [skip ci]"
          git push origin HEAD:ci-status --force

      # 失败时把错误摘要+日志尾部推回 ci-status 分支：
      # 公开仓库经 api.github.com 免登录即可读取（contents?ref=ci-status），
      # 省去每次手动截日志/配 token。[skip ci] 防止推送再触发 workflow。
      - name: Publish failure summary
        if: failure()
        run: |
          mkdir -p ci-status
          LOG=build-mkxp.log
          {
            echo "# MKXP build failure"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: ${GITHUB_SHA::7} $(git log -1 --format=%s)"
            echo "date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            if [ -f "$LOG" ]; then
              echo '## error lines'
              echo '```'
              { grep -nE "error:|fatal error|Error [0-9]+|FAILED|\*\*\*" "$LOG" || true; } | tail -60
              echo '```'
              echo '## log tail (120)'
              echo '```'
              tail -120 "$LOG"
              echo '```'
            else
              echo '(no build-mkxp.log found)'
            fi
          } > ci-status/last-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/last-failure.md
          git commit -m "ci: mkxp build failure summary [skip ci]"
          git push origin HEAD:ci-status --force

  # ============================================================================
  # iOS App 打包（原 ios.yml 的 workflow_run 链，合并进来）。
  # 为什么合并：workflow_run 触发的 workflow 里 GITHUB_TOKEN 对 contents 只读，
  # 失败摘要要推回分支只能依赖 CI_PUSH_TOKEN（PAT）——PAT 一过期就静默丢日志
  # （continue-on-error 吞掉），无人能看到编译错误。合并后本 workflow 由 push
  # 触发，GITHUB_TOKEN 可写，发布不再依赖任何 PAT。
  # ============================================================================
  build-ios:
    runs-on: macos-15
    needs: build-mkxp
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          flutter --version
          pod --version

      # flutter create 会重新生成根目录 pubspec.yaml/lib/ios ，先备份我们的源码
      - name: Backup app sources
        run: |
          cp pubspec.yaml /tmp/app_pubspec.yaml
          cp -r lib /tmp/app_lib

      - name: Generate iOS project (flutter create)
        run: flutter create --platforms=ios --org com.yourapp --project-name rpgxp_loader .

      - name: Restore sources & integrate plugin
        run: |
          cp -f /tmp/app_pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/app_lib lib
          flutter pub get

      - name: Enable file sharing
        run: |
          set -eo pipefail
          for kv in "UIFileSharingEnabled bool true" "UISupportsDocumentBrowser bool true"; do
            key=${kv%% *}; rest=${kv#* }
            /usr/libexec/PlistBuddy -c "Add :$key $rest" ios/Runner/Info.plist 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$key $rest" ios/Runner/Info.plist
          done
          /usr/libexec/PlistBuddy -c "Print" ios/Runner/Info.plist \
            | grep -E "FileSharing|DocumentBrowser" | tee -a /tmp/ios-build.log

      # 同一 run 内直取上游 job 的 MKXP.framework（不再经 gh run download）
      - name: Download MKXP.framework
        uses: actions/download-artifact@v4
        with:
          name: MKXP-framework
          path: mkxp/ios/MKXP.framework

      - name: Normalize framework layout
        run: |
          set -eo pipefail
          {
            # 兼容两种 zip 布局：内容在根 / 多嵌一层 MKXP.framework
            if [ -d mkxp/ios/MKXP.framework/MKXP.framework ]; then
              mv mkxp/ios/MKXP.framework/MKXP.framework/* mkxp/ios/MKXP.framework/
              rmdir mkxp/ios/MKXP.framework/MKXP.framework
            fi
            ls -R mkxp/ios/MKXP.framework
            test -f mkxp/ios/MKXP.framework/MKXP \
              || { echo "::error::MKXP.framework layout unexpected"; exit 1; }
          } 2>&1 | tee /tmp/ios-build.log

      - name: Link MKXP.framework into Runner
        run: |
          set -eo pipefail
          cp -f scripts/mkxp-link-anchor.m ios/Runner/MkxpLinkAnchor.m
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj
          ruby scripts/ios-link-mkxp.rb ios/Runner.xcodeproj mkxp/ios/MKXP.framework ios/Runner/MkxpLinkAnchor.m 2>&1 | tee -a /tmp/ios-build.log

      - name: Build iOS (no codesign)
        run: |
          set -eo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee -a /tmp/ios-build.log

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          {
            mkdir -p build/Payload
            cp -r build/ios/iphoneos/Runner.app build/Payload/
            cd build && zip -r app.ipa Payload
          } 2>&1 | tee -a /tmp/ios-build.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: rpgxp-loader-ipa
          path: build/app.ipa

      - name: Upload ios-build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: /tmp/ios-build.log
          if-no-files-found: warn

      # push 触发 → GITHUB_TOKEN 可写，直接推 ci-status-ios（与 ci-status 分开避免
      # build-mkxp 的快照 force-push 冲掉）。[skip ci] 防重触发。
      - name: Publish build status
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-status
          if [ "${{ job.status }}" = "success" ]; then STATUS="success"; else STATUS="failure"; fi
          {
            echo "# iOS build $STATUS"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: ${GITHUB_SHA::7} $(git log -1 --format=%s)"
            echo "date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo '## error lines'
            echo '```'
            { grep -nE "error:|Error:|Xcode build done|FAILED|Undefined symbol|duplicate symbol" /tmp/ios-build.log 2>/dev/null || true; } | tail -80
            echo '```'
            echo '## duplicate/undefined symbols (aggregated)'
            echo '```'
            grep -oE "(duplicate symbol|Undefined symbol): .*" /tmp/ios-build.log 2>/dev/null \
              | sed -E "s/.*'(_.*)'.*/\1/" | sort | uniq -c | sort -rn | head -60 || true
            echo '```'
            echo '## ios-build.log (tail 160)'
            echo '```'
            tail -160 /tmp/ios-build.log 2>/dev/null || echo '(no log)'
            echo '```'
          } > ci-status/last-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/last-failure.md
          git commit -m "ci: ios build status [skip ci]"
          git push origin HEAD:ci-status-ios --force
